<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Body Language Master Quiz</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(to right,#e0f2fe,#f8fafc);
    margin:0;
    padding:20px;
    color:#1e293b;
}

.container{
    max-width:1000px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

h1{
    text-align:center;
    color:#2563eb;
}

.subtitle{
    text-align:center;
    margin-bottom:30px;
    font-size:18px;
}

.question{
    background:#f8fafc;
    padding:20px;
    margin-bottom:20px;
    border-radius:15px;
}

.question p{
    font-weight:bold;
}

label{
    display:block;
    margin:8px 0;
    cursor:pointer;
}

button{
    display:block;
    margin:40px auto;
    padding:15px 35px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#1d4ed8;
}

#result{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin-top:30px;
}

</style>
</head>

<body>

<div class="container">

<h1>Body Language Master Quiz</h1>

<p class="subtitle">
50 Questions | Chapters 10–16
</p>

<form id="quizForm"></form>

<button type="button" onclick="gradeQuiz()">
    Submit Quiz
</button>

<div id="result"></div>

</div>

<script src="type.js"></script>

</body>
</html>
