<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Body Language Master Quiz</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(to right,#e0f2fe,#f8fafc);
    margin:0;
    padding:20px;
    color:#1e293b;
}

.container{
    max-width:1000px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

h1{
    text-align:center;
    color:#2563eb;
}

.subtitle{
    text-align:center;
    margin-bottom:30px;
    font-size:18px;
}

.question{
    background:#f8fafc;
    padding:20px;
    margin-bottom:20px;
    border-radius:15px;
}

.question p{
    font-weight:bold;
}

label{
    display:block;
    margin:8px 0;
    cursor:pointer;
}

button{
    display:block;
    margin:40px auto;
    padding:15px 35px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#1d4ed8;
}

#result{
    text-align:center;
    font-size:28px;
    font-weight:bold;
    margin-top:30px;
}

</style>
</head>

<body>

<div class="container">

<h1>Body Language Master Quiz</h1>
<p class="subtitle">50 Questions | Chapters 10–16</p>

<form id="quizForm"></form>

<button onclick="gradeQuiz()">Submit Quiz</button>

<div id="result"></div>

</div>

<script>

const questions = [

{
q:"1. What do open palms usually communicate?",
o:["Aggression","Honesty and openness","Fear","Sadness"],
a:"Honesty and openness"
},

{
q:"2. What does crossed arms commonly indicate?",
o:["Confidence","Relaxation","Defensiveness","Excitement"],
a:"Defensiveness"
},

{
q:"3. Which gesture is associated with dominance?",
o:["Palm-up gesture","Cowboy stance","Head tilt","Lip biting"],
a:"Cowboy stance"
},

{
q:"4. What does a head nod usually mean?",
o:["Disagreement","Agreement","Fear","Anxiety"],
a:"Agreement"
},

{
q:"5. What does shaking the head mean in most cultures?",
o:["Agreement","Approval","Negation","Excitement"],
a:"Negation"
},

{
q:"6. What is mirroring?",
o:["Copying gestures","Ignoring gestures","Avoiding eye contact","Standing still"],
a:"Copying gestures"
},

{
q:"7. Mirroring helps create:",
o:["Conflict","Rapport","Fear","Distance"],
a:"Rapport"
},

{
q:"8. What does foot-pointing often reveal?",
o:["Temperature","Direction of interest","Health issues","Aggression"],
a:"Direction of interest"
},

{
q:"9. What can tightly crossed legs indicate?",
o:["Openness","Confidence","Defensiveness","Excitement"],
a:"Defensiveness"
},

{
q:"10. The shoulder shrug usually means:",
o:["Understanding","Uncertainty","Dominance","Excitement"],
a:"Uncertainty"
},

{
q:"11. What gesture often shows anxiety?",
o:["Ankle lock","Open palms","Relaxed posture","Head nod"],
a:"Ankle lock"
},

{
q:"12. Hair touching may indicate:",
o:["Confidence","Nervousness or uncertainty","Anger","Boredom"],
a:"Nervousness or uncertainty"
},

{
q:"13. A palm-down gesture communicates:",
o:["Submission","Authority","Fear","Excitement"],
a:"Authority"
},

{
q:"14. Palm-up gestures appear:",
o:["Threatening","Dominant","Submissive and friendly","Hostile"],
a:"Submissive and friendly"
},

{
q:"15. Pointing fingers are usually perceived as:",
o:["Friendly","Relaxed","Aggressive","Funny"],
a:"Aggressive"
},

{
q:"16. A genuine smile usually includes:",
o:["Only the mouth","The eyes and mouth","Only the eyes","No eye movement"],
a:"The eyes and mouth"
},

{
q:"17. Covering the mouth may suggest:",
o:["Confidence","Truthfulness","Deception","Relaxation"],
a:"Deception"
},

{
q:"18. Touching the nose can be linked to:",
o:["Excitement","Lying or discomfort","Confidence","Friendliness"],
a:"Lying or discomfort"
},

{
q:"19. Leaning forward usually shows:",
o:["Interest","Fear","Rejection","Aggression"],
a:"Interest"
},

{
q:"20. Leaning backward may indicate:",
o:["Interest","Agreement","Discomfort or rejection","Excitement"],
a:"Discomfort or rejection"
},

{
q:"21. Direct eye contact can communicate:",
o:["Confidence","Fear","Sadness","Weakness"],
a:"Confidence"
},

{
q:"22. Avoiding eye contact may suggest:",
o:["Confidence","Interest","Discomfort or dishonesty","Excitement"],
a:"Discomfort or dishonesty"
},

{
q:"23. What does a firm handshake often show?",
o:["Weakness","Confidence","Fear","Sadness"],
a:"Confidence"
},

{
q:"24. A weak handshake may communicate:",
o:["Confidence","Dominance","Weakness or insecurity","Excitement"],
a:"Weakness or insecurity"
},

{
q:"25. People usually smile when they are:",
o:["Happy","Angry","Fearful","Defensive"],
a:"Happy"
},

{
q:"26. Raised eyebrows can signal:",
o:["Recognition or surprise","Sadness","Fear","Boredom"],
a:"Recognition or surprise"
},

{
q:"27. Lowered eyebrows may indicate:",
o:["Relaxation","Anger","Joy","Excitement"],
a:"Anger"
},

{
q:"28. What does sneering communicate?",
o:["Submission","Friendliness","Disgust or hostility","Fear"],
a:"Disgust or hostility"
},

{
q:"29. Which gesture can show critical evaluation?",
o:["Thumbs up","Hand on chin","Open palms","Relaxed arms"],
a:"Hand on chin"
},

{
q:"30. Which body position suggests openness?",
o:["Crossed arms","Open arms","Hands in pockets","Lowered head"],
a:"Open arms"
},

{
q:"31. Hands hidden in pockets can indicate:",
o:["Openness","Confidence","Withdrawal or dishonesty","Excitement"],
a:"Withdrawal or dishonesty"
},

{
q:"32. Feet pointing toward someone may show:",
o:["Interest","Fear","Disagreement","Sadness"],
a:"Interest"
},

{
q:"33. What does blushing often reveal?",
o:["Confidence","Emotional response","Aggression","Boredom"],
a:"Emotional response"
},

{
q:"34. Which gesture often appears when someone lies?",
o:["Palm exposure","Mouth covering","Relaxed posture","Open arms"],
a:"Mouth covering"
},

{
q:"35. What is congruence in body language?",
o:["Ignoring signals","Matching verbal and nonverbal communication","Crossing arms","Mirroring"],
a:"Matching verbal and nonverbal communication"
},

{
q:"36. Incongruence happens when:",
o:["Words and gestures match","Body language contradicts words","People smile","People nod"],
a:"Body language contradicts words"
},

{
q:"37. Which gender is often considered more perceptive in body language?",
o:["Men","Women","Children","Teenagers"],
a:"Women"
},

{
q:"38. Children are easier to read because:",
o:["They speak more","Their gestures are more obvious","They smile less","They avoid eye contact"],
a:"Their gestures are more obvious"
},

{
q:"39. What does a lowered chin often communicate?",
o:["Confidence","Negative attitude","Excitement","Friendliness"],
a:"Negative attitude"
},

{
q:"40. Open posture usually creates:",
o:["Trust","Fear","Aggression","Distance"],
a:"Trust"
},

{
q:"41. Which gesture is universal?",
o:["Head nodding","Specific dance moves","Waving only","Finger snapping"],
a:"Head nodding"
},

{
q:"42. Why is context important in body language?",
o:["Gestures always mean one thing","Gestures change meaning depending on situations","It is not important","Only facial expressions matter"],
a:"Gestures change meaning depending on situations"
},

{
q:"43. Crossed arms in cold weather may simply mean:",
o:["Defensiveness","Aggression","Feeling cold","Dishonesty"],
a:"Feeling cold"
},

{
q:"44. What does prolonged staring often communicate?",
o:["Interest or dominance","Fear","Relaxation","Submission"],
a:"Interest or dominance"
},

{
q:"45. Which gesture often signals submission?",
o:["Palm-up gesture","Pointing finger","Fist","Hands on hips"],
a:"Palm-up gesture"
},

{
q:"46. Hands on hips can communicate:",
o:["Power and readiness","Fear","Submission","Dishonesty"],
a:"Power and readiness"
},

{
q:"47. What does a fake smile usually lack?",
o:["Teeth","Eye involvement","Lip movement","Head movement"],
a:"Eye involvement"
},

{
q:"48. What is one sign of nervousness?",
o:["Fidgeting","Open posture","Relaxed breathing","Balanced stance"],
a:"Fidgeting"
},

{
q:"49. Why do people mirror each other?",
o:["To create social connection","To confuse others","To appear dominant","To avoid communication"],
a:"To create social connection"
},

{
q:"50. Body language is best interpreted:",
o:["One gesture at a time","Without context","Using gesture clusters and context","Only through facial expressions"],
a:"Using gesture clusters and context"
}

];

const form = document.getElementById("quizForm");

questions.forEach((item,index)=>{

    const div = document.createElement("div");
    div.classList.add("question");

    let html = `<p>${item.q}</p>`;

    item.o.forEach(option=>{
        html += `
        <label>
        <input type="radio" name="q${index}" value="${option}">
        ${option}
        </label>
        `;
    });

    div.innerHTML = html;
    form.appendChild(div);

});

function gradeQuiz(){

    let score = 0;

    questions.forEach((item,index)=>{

        const selected = document.querySelector(`input[name="q${index}"]:checked`);

        if(selected && selected.value === item.a){
            score++;
        }

    });

    let percentage = ((score/questions.length)*100).toFixed(0);

    document.getElementById("result").innerHTML =
    `You scored ${score}/50<br>Final Grade: ${percentage}%`;

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior:'smooth'
    });

}

</script>

</body>
</html>
